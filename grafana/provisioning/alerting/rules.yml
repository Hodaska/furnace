apiVersion: 1

groups:
  - orgId: 1
    name: furnace-alerts
    folder: Alerts
    interval: 10s
    rules:
      - uid: furnace-temp-alarm
        title: "Авария: температура >= 100°C"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 30
              to: 0
            datasourceUid: "influxdb-furnace"
            model:
              datasource:
                type: influxdb
              query: >
                SELECT last("temperature") FROM "furnace"
              refId: A
          - refId: C
            datasourceUid: "__expr__"
            model:
              conditions:
                - evaluator:
                    params: [100]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              refId: C
              type: classic_conditions
        noDataState: OK
        execErrState: OK
        for: 5s
        annotations:
          summary: "Температура печи достигла {{ $values.A }}°C"
          description: "Аварийное отключение. Температура превысила 100°C"
        labels:
          severity: critical
